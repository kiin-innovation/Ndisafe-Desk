name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - name: Install NASM
        run: choco install nasm -y
      - name: Install vcpkg
        shell: powershell
        run: |
          if (-Not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\\vcpkg"
      - name: Install vcpkg dependencies
        shell: powershell
        run: |
          Write-Output "Installing necessary vcpkg packages (this may take a while)..."
          & C:\vcpkg\vcpkg.exe install opus:x64-windows
      - name: Build RustDesk
        run: python build.py --portable --skip-portable-pack
      - name: Show build outputs
        shell: powershell
        run: |
          if (Test-Path target\release) {
            Get-ChildItem -Path target\release -Recurse | Select-Object FullName, Length
          } else {
            Write-Output 'No target\release directory found'
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndisafe-desk-windows
          path: |
            target/release/*.exe
            target/release/**/*.exe
