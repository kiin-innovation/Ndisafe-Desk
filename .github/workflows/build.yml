name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            C:\\Users\\runneradmin\\.cargo\\registry
            C:\\Users\\runneradmin\\.cargo\\git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: C:\\vcpkg\\installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
      - name: Install NASM
        run: choco install nasm -y
      - name: Install vcpkg
        shell: powershell
        run: |
          if (-Not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\\vcpkg"
      - name: Install sccache
        shell: powershell
        run: |
          Write-Output "Installing sccache..."
          cargo install sccache --locked
      - name: Configure sccache
        shell: powershell
        run: |
          $sccachePath = "$env:USERPROFILE\\.cargo\\bin\\sccache.exe"
          if (Test-Path $sccachePath) {
            Add-Content -Path $env:GITHUB_ENV -Value "RUSTC_WRAPPER=$sccachePath"
          } else {
            Write-Output "sccache not found at $sccachePath"
          }
      - name: Install vcpkg dependencies (manifest)
        shell: powershell
        run: |
          Write-Output "Installing vcpkg packages from vcpkg.json (this may take a while)..."
          # Build static triplet because the project expects x64-windows-static libs/headers
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static
      - name: Build RustDesk
        run: python build.py --portable --skip-portable-pack
      - name: Show build outputs
        shell: powershell
        run: |
          if (Test-Path target\release) {
            Get-ChildItem -Path target\release -Recurse | Select-Object FullName, Length
          } else {
            Write-Output 'No target\release directory found'
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndisafe-desk-windows
          path: |
            target/release/*.exe
            target/release/**/*.exe
