# Build and publish the NDISafe Desk server image (hbbs + hbbr) to
# Docker Hub as calvin207/ndisafedesk. Runs on the same push
# that triggers the Windows/macOS client builds.

name: NDISafe Desk - Publish Server Docker Image

on:
  push:
    branches: ["ndisafe-desk"]
  workflow_dispatch:

env:
  SERVER_IMAGE: calvin207/ndisafedesk
  RUSTDESK_SERVER_VERSION: "1.1.16"

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ env.RUSTDESK_SERVER_VERSION }}
          build-args: |
            RUSTDESK_SERVER_VERSION=${{ env.RUSTDESK_SERVER_VERSION }}